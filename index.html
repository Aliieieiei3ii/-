                { q: "**ما** **هو** **الغاز** **الأخف** **وزناً** **وكثافة** **على** **الإطلاق** **في** **الكون؟**", options: ["**الهيليوم**", "**الهيدروجين**", "**النيون**", "**النيتروجين**"], correct: 1, fact: "**تلميح**: **الغاز** **صاحب** **الرمز** **الكيميائي** H." },  
                { q: "**كم** **يبلغ** **عدد** **السيمفونيات** **التي** **ألفها** **الموسيقار** **الشهير** **بيتهوفن؟**", options: ["7", "9", "11", "12"], correct: 1, fact: "**تلميح**: **عدد** **أقل** **من** 10 **والمشهورة** **جداً** **هي** **التاسعة**." },  
                { q: "**ما** **هي** **الدولة** **الحائزة** **على** **أكبر** **عدد** **شواطئ** **ونقاط** **مرجانية** **بالبحر** **الأحمر؟**", options: ["**مصر**", "**السودان**", "**السعودية**", "**إريتريا**"], correct: 2, fact: "**تلميح**: **الدولة** **التي** **تمتلك** **الساحل** **الشرقي** **الأطول** **للبحر** **الأحمر**." },  
                { q: "**ما** **هي** **المادة** **الملونة** **التي** **تعطي** **الجلد** **والشعر** **والأعين** **ألوانها** **الطبيعية؟**", options: ["**الملانين**", "**الكيراتين**", "**الكولاجين**", "**الهيموجلوبين**"], correct: 0, fact: "**تلميح**: **صبغة** **تفرزها** **خلايا** **الجلد** **للحماية** **من** **الأشعة**." },  
                { q: "**من** **كتب** **ملحمة** '**الشاهنامة**' **التاريخية؟**", options: ["**المتنبي**", "**الفردوسي**", "**عمر** **الخيام**", "**ابن** **خلدون**"], correct: 1, fact: "**تلميح**: **شاعر** **فارسي** **كبير** **يتكون** **اسمه** **من** 7 **حروف**." },  
                { q: "**ما** **هو** **البعد** **الأقرب** **بالسنوات** **الضوئية** **بين** **الأرض** **وأقرب** **نظام** **نجمي** (**قنطورس** **القريب**)**؟**", options: ["2.2", "4.2", "8.6", "10.5"], correct: 1, fact: "**تلميح**: **المسافة** **تتراوح** **بين** 4 **إلى** 5 **سنوات** **ضوئية**." },  
                { q: "**سؤال** **الملايين** **الثلاثة** **التعجيزي**: **ما** **هو** **اسم** **أقصر** **زمن** **قياسي** **معروف** **بالفيزياء** (**زمن** **حركة** **الضوء** **لقطع** **بروتون**)**؟**", options: ["**زمن** **بليمتو**", "**زمن** **زبتوثانية**", "**زمن** **الفيمتو**", "**زمن** **بلانك**"], correct: 1, fact: "**تلميح**: **مقياس** **زمني** **ويعرف** **بـ** Zeptosecond." }  
            ]  
        };  
  
        let currentLevel = 1;  
        let lives = 3;  
        let currentIndex = 0;  
        let isAnsweringAllowed = true;  
  
        // **متغيرات** **للتحكم** **بفرص** **المساعدات** (**مرة** **واحدة** **لكل** **منها**)  
        let usedFifty = false;  
        let usedHint = false;  
        let usedGoogle = false;  
  
        function loadQuestion() {  
            const currentQuestionsList = levelsData[currentLevel];  
  
            if (currentIndex >= currentQuestionsList.length) {  
                if (currentLevel === 1) {  
                    alert("🎉 **أسطوووورة**!! **لقد** **أجبت** **على** **جميع** **الـ** 30 **سؤالاً** **وربحت** **الـ** $1,000,000 **بالأول**!\n\n**جاهز** **للتحدي** **الثاني** **للوصول** **إلى** $2,000,000**؟**");  
                    currentLevel = 2;  
                    currentIndex = 0;  
                    loadQuestion();  
                } else if (currentLevel === 2) {  
                    alert("🔥 **بطل** **حقيقي**!! **كسبت** **الـ** $2,000,000 **بنجاح**!\n\n**الآن** **ينفتح** **المستوى** **الثالث** **والتعجيزي** **النهائي** **لتحدي** **الـ** $3,000,000!");  
                    currentLevel = 3;  
                    currentIndex = 0;  
                    loadQuestion();  
                } else {  
                    alert("🏆🏆🏆 **إنجاز** **تاريخي** **خيالي**!! **لقد** **قهرت** **الأسئلة** **التعجيزية** **وختمت** **المستويات** **الثلاثة** **وحصلت** **على** **الجائزة** **الكبرى**: $3,000,000!");  
                }  
                return;  
            }  
  
            isAnsweringAllowed = true;  
            const qData = currentQuestionsList[currentIndex];  
              
            document.getElementById("question-text").innerText = qData.q;  
            document.getElementById("counter-display").innerText = `**السؤال** ${currentIndex + 1} **من** 30`;  
              
            const currentPrize = prizePrizesByLevel[currentLevel][currentIndex];  
            document.getElementById("score-display").innerText = `$ ${currentPrize.toLocaleString()}`;  
  
            // **تحديث** **الشارة**  
            const levelBadges = {  
                1: "**المستوى** 1 (**تحدي** 1,000,000$)",  
                2: "**المستوى** 2 (**تحدي** 2,000,000$)",  
                3: "**المستوى** 3 **التعجيزي** (**تحدي** 3,000,000$)"  
            };  
            document.getElementById("level-display").innerText = levelBadges[currentLevel];  
  
            const buttons = document.querySelectorAll(".option-btn");  
            buttons.forEach((btn, idx) => {  
                btn.className = "option-btn";  
                btn.style.visibility = "visible";  
                btn.querySelector(".option-text").innerText = qData.options[idx];  
            });  
  
            // **تحديث** **حالة** **الأزرار** **الثلاثة** **بناءً** **على** **استخدامها**  
            document.getElementById("fifty-btn").disabled = usedFifty;  
            document.getElementById("hint-btn").disabled = usedHint;  
            document.getElementById("google-btn").disabled = usedGoogle;  
        }  
  
        function checkAnswer(selectedIdx) {  
            if (!isAnsweringAllowed) return;  
            isAnsweringAllowed = false;  
  
            const qData = levelsData[currentLevel][currentIndex];  
            const buttons = document.querySelectorAll(".option-btn");  
  
            if (selectedIdx === qData.correct) {  
                buttons[selectedIdx].classList.add("correct");  
                  
                setTimeout(() => {  
                    currentIndex++;  
                    loadQuestion();  
                }, 1000);  
            } else {  
                buttons[selectedIdx].classList.add("wrong");  
                buttons[qData.correct].classList.add("correct");  
                lives--;  
                  
                updateHeartsDisplay();  
  
                if (lives <= 0) {  
                    setTimeout(() => {  
                        alert("**خسرت** **جميع** **القلوب**! **ستبدأ** **من** **بداية** **المستوى** **الحالي** **وتُستعاد** **جميع** **المساعدات**.");  
                        resetLevel();  
                    }, 1200);  
                } else {  
                    setTimeout(() => {  
                        currentIndex++;  
                        loadQuestion();  
                    }, 1500);  
                }  
            }  
        }  
  
        function updateHeartsDisplay() {  
            let heartsStr = "";  
            for (let i = 0; i < lives; i++) heartsStr += "❤️";  
            document.getElementById("hearts-display").innerText = heartsStr;  
        }  
  
        function resetLevel() {  
            lives = 3;  
            currentIndex = 0;  
            // **إعادة** **ضبط** **استخدام** **جميع** **المساعدات** **عند** **الخسارة** **بالكامل**  
            usedFifty = false;  
            usedHint = false;  
            usedGoogle = false;  
            updateHeartsDisplay();  
            loadQuestion();  
        }  
  
        function useFiftyFifty() {  
            if (!isAnsweringAllowed || usedFifty) return;  
            usedFifty = true;  
            document.getElementById("fifty-btn").disabled = true;  
  
            const qData = levelsData[currentLevel][currentIndex];  
            const buttons = document.querySelectorAll(".option-btn");  
            let removed = 0;  
  
            for (let i = 0; i < buttons.length; i++) {  
                if (i !== qData.correct && removed < 2) {  
                    buttons[i].style.visibility = "hidden";  
                    removed++;  
                }  
            }  
        }  
  
        function useHint() {  
            if (!isAnsweringAllowed || usedHint) return;  
            usedHint = true;  
            document.getElementById("hint-btn").disabled = true;  
  
            const qData = levelsData[currentLevel][currentIndex];  
            alert(`💡 **تلميح** **للإجابة**:\n\n${qData.fact}`);  
        }  
  
        function useGoogle() {  
            if (!isAnsweringAllowed || usedGoogle) return;  
            usedGoogle = true;  
            document.getElementById("google-btn").disabled = true;  
  
            const qData = levelsData[currentLevel][currentIndex];  
            const correctAnswerText = qData.options[qData.correct];  
            const letters = ["A", "B", "C", "D"];  
            const correctLetter = letters[qData.correct];  
  
            alert(`🔍 **بحث** Google:\n\n**جاري** **البحث** **عن**: "${qData.q}"...\n\n✅ **نتيجة** **البحث** **المؤكدة** 100% **هي**:\n**الخيار** (${correctLetter}): ${correctAnswerText}`);  
        }  
  
        // **بدء** **اللعبة**  
        loadQuestion();  
    </script>
